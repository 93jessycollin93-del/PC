set default=0
set timeout=5
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod serial

# Mirror the menu to COM1 as well as the screen, so a headless or
# serial-attached machine can see and drive the boot menu. On hardware with no
# serial port these two lines fail harmlessly and the screen still works.
serial --unit=0 --speed=115200
terminal_output gfxterm serial
terminal_input console serial

menuentry "Jackie's PC (live)" {
    linux /casper/vmlinuz boot=casper quiet splash noprompt ---
    initrd /casper/initrd
}

menuentry "Jackie's PC (live, persistent)" {
    # Requires a second partition or file labelled casper-rw on the USB stick.
    # See boot/README.md -> Persistence.
    linux /casper/vmlinuz boot=casper persistent quiet splash noprompt ---
    initrd /casper/initrd
}

menuentry "Jackie's PC (safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset quiet noprompt ---
    initrd /casper/initrd
}

menuentry "Jackie's PC (serial console, for headless testing)" {
    # Pairs with boot/scripts/test-qemu.sh when it has no display to draw into.
    linux /casper/vmlinuz boot=casper console=tty0 console=ttyS0,115200n8 systemd.unit=multi-user.target noprompt ---
    initrd /casper/initrd
}

menuentry "Jackie's PC (console only, no kiosk)" {
    # Boots to a text console with the app server still running on :5000.
    linux /casper/vmlinuz boot=casper systemd.unit=multi-user.target noprompt ---
    initrd /casper/initrd
}
