# eYe OS kernel hardening.
#
# Drawn from the Kernel Self Protection Project recommendations and the CIS
# Linux benchmark, filtered to what an appliance actually needs. Every line
# here is checked at runtime by `eye-audit`, against the live sysctl rather
# than against this file.
#
# What is deliberately NOT here is as important as what is:
#
#   user.max_user_namespaces is left alone. Disabling user namespaces is a
#   common hardening recommendation and it would be actively harmful here —
#   WebKit sandboxes its renderers with bubblewrap, which needs them. Turning
#   it off would trade a theoretical local-privilege-escalation surface for
#   the loss of the browser's own process sandbox, on a machine whose main
#   job is running a browser.
#
#   kernel.modules_disabled is set at the end of boot by eye-harden, not
#   here, because sysctl.d is applied before the modules the system needs
#   have finished loading.

# ---------------------------------------------------------------- kernel

# Kernel addresses and the ring buffer are an exploit-writing aid; neither is
# any use to an unprivileged process on an appliance.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# Yama: only a declared parent may ptrace a process. Blocks the standard
# "read the other process's memory" step after a renderer compromise.
kernel.yama.ptrace_scope = 2

# The JIT is a well-worn exploitation primitive; unprivileged users have no
# reason to reach it. (The firewall uses nftables, not eBPF.)
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# No booting a different kernel from a running one, and no magic sysrq from
# an attached keyboard.
kernel.kexec_load_disabled = 1
kernel.sysrq = 0

# Performance counters can leak across privilege boundaries.
kernel.perf_event_paranoid = 3

# Full address space randomisation.
kernel.randomize_va_space = 2

# Core dumps from a process holding API keys would write those keys to disk.
fs.suid_dumpable = 0

# ------------------------------------------------------------ filesystem

# The classic symlink and hardlink races in world-writable directories.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ---------------------------------------------------------------- network
#
# The firewall already drops all of this. These are the second line, for the
# window before nftables loads and for the case where it does not.

net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Reverse-path filtering: drop packets whose source address could not have
# arrived on that interface.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

net.ipv4.tcp_syncookies = 1

# Log packets with impossible addresses.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
