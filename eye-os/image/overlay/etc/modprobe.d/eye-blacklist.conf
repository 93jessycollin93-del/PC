# Kernel modules eYe OS will not load.
#
# Every module in the kernel is attack surface whether or not anything uses
# it, and the filesystem and protocol drivers below are parsers that will
# happily be reached by plugging in a crafted disk or receiving a crafted
# packet. This is the same list the CIS benchmark uses and roughly what
# Bottlerocket and Talos strip out at build time.
#
# `install <mod> /bin/false` rather than `blacklist <mod>`: blacklist only
# stops automatic loading by alias, and anything that can call modprobe
# directly gets the module anyway. This refuses both paths.

# --- Uncommon filesystems -----------------------------------------------
# Reachable by inserting a USB stick. None of them will ever appear on this
# machine's own disk.
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install gfs2 /bin/false
install ksmbd /bin/false
install cifs /bin/false
install nfs /bin/false
install nfsv3 /bin/false
install nfsv4 /bin/false

# --- Uncommon network protocols -----------------------------------------
# Each is a packet parser running in the kernel for a protocol this appliance
# does not speak.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false

# --- DMA-capable buses --------------------------------------------------
# FireWire and Thunderbolt allow a device to read host memory directly. On a
# machine that may be left unattended this is the cheapest physical-access
# mitigation there is.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install thunderbolt /bin/false

# --- NOT blacklisted, deliberately --------------------------------------
#
# usb-storage is left loadable. Blacklisting it is a real hardening measure
# for a fixed installation — it stops both data exfiltration to a stick and
# the crafted-filesystem attacks the list above is about — but this image is
# also written to a USB stick and booted from it, and a machine that cannot
# read its own root device does not boot. Enable it only on a system
# installed to internal storage:
#
#     echo 'install usb-storage /bin/false' > /etc/modprobe.d/eye-usb.conf
#
# vivid is a test driver with a history of CVEs, but it is not built by
# Ubuntu's generic kernel, so there is nothing here to refuse.
