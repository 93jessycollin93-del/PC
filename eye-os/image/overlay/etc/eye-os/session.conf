# Which session eYe OS boots, and what the proxy in front of it will pass.
#
# Read by eye-hostd.service. After editing:
#     systemctl restart eye-hostd
#     eye-audit

# --- Session ----------------------------------------------------------
#
# EYE_SESSION   pc     the PC application — the full app roster
#               shell  the minimal recovery shell that ships with eye-os
#
# EYE_STATIC    what eye-hostd serves at /. build.sh sets this to match the
#               session it installed.
#
# The recovery shell is always installed, so there is always a way back in
# when a change to the PC session leaves it unable to paint. To switch, point
# EYE_STATIC at /opt/eye-os/shell and restart eye-hostd and eye-kiosk.

EYE_SESSION=pc
EYE_STATIC=/opt/eye-os/pc/dist

# --- Upstream policy --------------------------------------------------
#
# Routes the proxy refuses before they reach the session server. These are
# the ones that execute commands, run builds, or read and write the host
# filesystem — the difference between "a compromised page can misuse the AI
# apps" and "a compromised page owns the machine".
#
# eye-hostd injects the session token on everything it does forward, so the
# UI works without the browser ever holding a credential. That is also why
# this list matters: without it, injecting the token would simply hand the
# renderer the very routes the token protects.
#
# Comma-separated path prefixes. Empty means nothing is blocked.
#
# The PC application's Terminal, Build and Shell apps will report errors
# while these are blocked. That is the intended trade on an appliance; if you
# want them, remove the prefix and understand what you are re-opening.

EYE_BLOCKED_UPSTREAM=/api/shell/,/api/build/,/api/term-fs/

# --- Session server ---------------------------------------------------
# Where the PC application's Express backend listens. Loopback only; the
# firewall drops anything arriving from a wire regardless.

EYE_UPSTREAM_HOST=127.0.0.1
EYE_UPSTREAM_PORT=5000
