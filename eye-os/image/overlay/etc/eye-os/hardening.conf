# Hardening steps that trade capability for security, left to you to choose.
#
# Everything in sysctl.d/99-eye-hardening.conf and modprobe.d/eye-blacklist.conf
# is always on — those cost nothing. The two below cost something real, so
# they are off by default on a machine you are still building and exploring.
#
# `eye-audit` reports both, so an off switch is visible rather than forgotten.
#
# After editing:  systemctl restart eye-harden  (or reboot)

# Refuse to load any further kernel module once boot is complete.
#
# This is what ChromeOS and Android do, and it closes the most direct route
# from root to kernel code execution. The cost is that genuinely new hardware
# stops working until you reboot — plugging in a class of device whose driver
# was not already loaded will do nothing. Devices of a class already present
# (another USB keyboard, another storage device) are unaffected.
#
# Turn this on once the machine's hardware has settled.
EYE_LOCK_MODULES=0

# Refuse the USB mass-storage driver.
#
# Stops both data exfiltration to a stick and the crafted-filesystem attacks
# that the module blacklist is about. Do NOT enable this while running from a
# USB stick — the machine will not find its own root device on the next boot.
# Safe once installed to internal storage.
EYE_DISABLE_USB_STORAGE=0
