# Destinations this machine may reach. Everything else is dropped.
#
# One entry per line: a hostname, an IPv4/IPv6 address, or a CIDR block.
# Hostnames are resolved when the firewall is applied, not per connection —
# a host behind rotating IPs needs a CIDR or a periodic reload
# (`systemctl restart eye-firewall`).
#
# Nothing here is enabled by default. An eYe OS machine that has never been
# told where it may go, does not go anywhere. Uncomment what you actually
# use and leave the rest closed — that is the entire point.
#
# Comments and blank lines are ignored. Apply with:
#     sudo systemctl restart eye-firewall
#     eye-audit

# --- AI providers -----------------------------------------------------
# The PC session's AI apps need whichever of these you actually use.
# generativelanguage.googleapis.com
# api.anthropic.com
# api.openai.com

# --- Package and model downloads --------------------------------------
# Needed only when you are installing things, not to run the session.
# Turn them off again afterwards.
# archive.ubuntu.com
# security.ubuntu.com
# registry.npmjs.org
# huggingface.co
# cdn-lfs.huggingface.co

# --- Local network ----------------------------------------------------
# Uncomment to reach other machines on your LAN (a local Ollama, say).
# 192.168.0.0/16
# 10.0.0.0/8
