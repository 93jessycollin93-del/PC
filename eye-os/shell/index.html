<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>eYe OS</title>
    <style>
      /* Painted before any JavaScript parses, so a slow boot on real hardware
         shows something deliberate instead of a white flash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10151d;
        color: #8899ab;
        font: 14px ui-sans-serif, system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
      }
      #boot-splash .mark {
        font-size: 30px;
        letter-spacing: 0.35em;
        color: #5aa9e6;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="mark">◈</div>
      <div>starting eYe OS…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
